name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (offline, deterministic)
        run: python -m unittest discover -s tests -v
      - name: Security check — no tokens in repo
        shell: bash
        run: |
          ! grep -rEn "ghp_[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9]{20,}" --include="*.py" --include="*.md" --include="*.json" .
